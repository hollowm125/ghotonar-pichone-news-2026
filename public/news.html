<!doctype html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>নিউজ</title><link rel="stylesheet" href="/style.css"><meta property="og:type" content="article"><meta property="og:title" content="ঘটনার পিছনে"><meta property="og:description" content="ঘটনার পিছনে — সত্য ঘটনা, খবর ও বিশ্লেষণ"><meta property="og:site_name" content="ঘটনার পিছনে"></head><body><header><div class="top"><a class="brand" href="/">ঘটনার পিছনে</a></div></header><main><article id="article"></article><section><h2>মন্তব্য</h2><form id="comment"><input name="name" placeholder="আপনার নাম" required><textarea name="text" placeholder="মন্তব্য লিখুন" required></textarea><button>মন্তব্য পাঠান</button></form><div id="comments"></div></section></main><script>const id=new URLSearchParams(location.search).get('id');const api=async(u,o={})=>{let r=await fetch(u,o),d=await r.json();if(!r.ok)throw Error(d.error);return d};(async()=>{let n=await api('/api/news/'+id);document.title=n.title;document.querySelector('#article').innerHTML=
'<div class="meta">'+(n.category||'সংবাদ')+' · '+new Date(n.created_at).toLocaleString('bn-BD')+'</div>'+
'<h1>'+n.title+'</h1>'+
'<div style="display:flex;gap:10px;margin:10px 0;flex-wrap:wrap;">
<button onclick="copyNewsLink()" style="padding:10px 16px;border:0;border-radius:8px;background:#111;color:#fff;font-size:16px;">🔗 লিংক কপি করুন</button>
<button onclick="shareNews()" style="padding:10px 16px;border:0;border-radius:8px;background:#1877f2;color:#fff;font-size:16px;">📤 শেয়ার করুন</button>
</div>'+
(n.image ? '<img src="'+n.image+'" alt="'+n.title+'" style="width:100%;max-height:500px;object-fit:cover;border-radius:12px;margin:15px 0;">' : '')+
'<p>'+(n.excerpt||'')+'</p><hr>'+
'<div style="font-size:19px;line-height:1.9">'+n.content.replace(/\n/g,'<br>')+'</div>';loadComments()})();async function loadComments(){let c=await api('/api/news/'+id+'/comments');document.querySelector('#comments').innerHTML=c.map(x=>'<div class="card" style="padding:14px;margin:10px 0"><b>'+x.name+'</b><p>'+x.text+'</p></div>').join('')}document.querySelector('#comment').onsubmit=async e=>{e.preventDefault();try{await api('/api/news/'+id+'/comments',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});alert('মন্তব্য অনুমোদনের জন্য পাঠানো হয়েছে');e.target.reset()}catch(x){alert(x.message)}};</script><script>
function shareNews(){
  if(navigator.share){
    navigator.share({title:document.title,url:window.location.href});
  }else{
    alert("এই ব্রাউজারে সরাসরি শেয়ার অপশন নেই। লিংক কপি করে শেয়ার করুন।");
  }
}
function copyNewsLink(){
  navigator.clipboard.writeText(window.location.href).then(()=>{
    alert("নিউজের লিংক কপি হয়েছে! ✅");
  });
}
</script>
<button onclick="copyNewsLink()" style="position:fixed;bottom:20px;right:20px;padding:12px 18px;border:0;border-radius:8px;background:#111;color:#fff;font-size:16px;z-index:9999;">🔗 লিংক কপি করুন</button>
</body></html>
