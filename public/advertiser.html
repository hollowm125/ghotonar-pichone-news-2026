<!doctype html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>বিজ্ঞাপনদাতা ড্যাশবোর্ড</title><link rel="stylesheet" href="/style.css"></head><body><main><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><h1>📢 বিজ্ঞাপনদাতা ড্যাশবোর্ড</h1><a href="/">← নিউজ সাইটে ফিরে যান</a></div><div id="me" class="card" style="padding:16px"></div><h2>নতুন বিজ্ঞাপনের আবেদন</h2><form id="adForm" class="card" style="padding:20px"><input name="title" placeholder="বিজ্ঞাপনের শিরোনাম" required><input name="link" type="url" placeholder="বিজ্ঞাপনে ক্লিক করলে যে লিংকে যাবে" required><select name="package" required><option value="">প্যাকেজ নির্বাচন করুন</option><option value="homepage">হোমপেজ ব্যানার</option><option value="article">নিউজ পেজ বিজ্ঞাপন</option><option value="premium">প্রিমিয়াম স্পট</option></select><select name="payment_method" required><option value="">পেমেন্ট মাধ্যম</option><option value="bKash">bKash</option><option value="Nagad">Nagad</option><option value="Bank">Bank</option></select><input name="payment_reference" placeholder="পেমেন্ট রেফারেন্স / Transaction ID" required><label>বিজ্ঞাপনের ছবি/ব্যানার</label><input name="image" type="file" accept="image/*" required><button>📤 বিজ্ঞাপন জমা দিন</button></form><h2>আমার বিজ্ঞাপনসমূহ</h2><div id="ads"></div></main><script>const api=async(u,o={})=>{let r=await fetch(u,o),d=await r.json();if(!r.ok)throw Error(d.error||'Error');return d};async function load(){try{let m=await api('/api/me');if(!m.user||m.user.role!=='advertiser'){location.href='/';return}document.querySelector('#me').innerHTML='<b>নাম:</b> '+m.user.name+'<br><b>ইমেইল:</b> '+m.user.email;let ads=await api('/api/my-ads');document.querySelector('#ads').innerHTML=ads.length?ads.map(a=>'<div class="card" style="padding:14px;margin:8px 0"><b>'+a.title+'</b><br>প্যাকেজ: '+(a.package||'—')+'<br>স্ট্যাটাস: <strong>'+a.status+'</strong><br>জমা: '+new Date(a.created_at).toLocaleString('bn-BD')+'</div>').join(''):'এখনও কোনো বিজ্ঞাপনের আবেদন জমা দেওয়া হয়নি।'}catch(e){alert(e.message);location.href='/'}}document.querySelector('#adForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/ads',{method:'POST',body:new FormData(e.target)});alert('বিজ্ঞাপনের আবেদন সফলভাবে জমা হয়েছে। Admin অনুমোদনের পর বিজ্ঞাপন প্রকাশ হবে।');e.target.reset();load()}catch(err){alert(err.message)}};load();</script></body></html>
